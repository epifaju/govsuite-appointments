services:
  postgres:
    image: postgres:16-alpine
    container_name: govsuite-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - govsuite


  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: govsuite-n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      mailpit:
        condition: service_started

    environment:
      # PostgreSQL
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Sécurité n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Configuration interne n8n
      # IMPORTANT :
      # n8n écoute sur 5678 DANS le conteneur.
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}

      # URLs utilisées par le navigateur / webhooks
      # Le navigateur accède à n8n sur localhost:5680.
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}

      # Timezone
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}

      # Configuration locale
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      # Nécessaire pour votre environnement HTTP local
      N8N_SECURE_COOKIE: "false"

    ports:
      # Port Windows : port interne Docker
      - "${N8N_EXTERNAL_PORT}:5678"

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows

    networks:
      - govsuite


  mailpit:
    image: axllent/mailpit:latest
    container_name: govsuite-mailpit
    restart: unless-stopped

    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

    volumes:
      - mailpit_data:/data

    networks:
      - govsuite


volumes:
  postgres_data:
  n8n_data:
  mailpit_data:


networks:
  govsuite:
    driver: bridge